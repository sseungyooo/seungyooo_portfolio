<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>관리자 · SEUNG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head>
<body><main><a class="back" href="index.html">← 홈페이지로</a>
<section id="login"><p class="tag">LOGIN</p><h1>포트폴리오<br>관리자</h1><p>사이트의 문구, 크기, 색상, 작업 이미지를 편집할 수 있습니다.</p><form id="loginForm"><label>이메일<input id="email" type="email" placeholder="관리자 이메일" required></label><label>비밀번호<input id="password" type="password" placeholder="비밀번호 입력" required></label><button>로그인 →</button><small>Supabase에 만든 관리자 계정으로 로그인하세요.</small></form></section>
<section id="dashboard" hidden><div class="top"><div><p class="tag">CONTENT MANAGER</p><h1>사이트 편집</h1></div><button id="logout" class="secondary">로그아웃</button></div><p class="intro">저장 후 홈페이지를 새로고침하면 결과를 확인할 수 있습니다.</p><form id="settingsForm">
<div class="panel"><h2>첫 화면</h2><label>메인 문구<textarea name="heroTitle" rows="3"></textarea></label><label>소개 문구<textarea name="heroIntro" rows="2"></textarea></label><label>메인 문구 크기 <output id="heroSizeValue"></output><input class="range" name="heroSize" type="range" min="48" max="150" step="1"></label><label>첫 화면 배경색<input class="color" name="heroBg" type="color"></label><label>메인 이미지<input id="heroImageInput" type="file" accept="image/*"></label><button id="removeHeroImage" class="remove-image" type="button">메인 이미지 제거</button></div>
<div class="panel"><h2>소개 영역</h2><label>소개 제목<textarea name="aboutTitle" rows="2"></textarea></label><label>소개 본문<textarea name="aboutText" rows="4"></textarea></label><label>소개 제목 크기 <output id="aboutSizeValue"></output><input class="range" name="aboutSize" type="range" min="32" max="100" step="1"></label></div>
<div class="panel"><h2>작업물</h2><p class="help">제목·설명·대표 이미지를 각각 바꿀 수 있습니다. 사진은 3MB 이하를 권장합니다.</p><div class="projects">
<fieldset><legend>01</legend><label>제목<input name="projectTitle0"></label><label>설명<input name="projectDetail0"></label><label>대표 이미지<input class="image-input" data-index="0" type="file" accept="image/*"></label><button class="remove-image" data-index="0" type="button">이미지 제거</button></fieldset>
<fieldset><legend>02</legend><label>제목<input name="projectTitle1"></label><label>설명<input name="projectDetail1"></label><label>대표 이미지<input class="image-input" data-index="1" type="file" accept="image/*"></label><button class="remove-image" data-index="1" type="button">이미지 제거</button></fieldset>
<fieldset><legend>03</legend><label>제목<input name="projectTitle2"></label><label>설명<input name="projectDetail2"></label><label>대표 이미지<input class="image-input" data-index="2" type="file" accept="image/*"></label><button class="remove-image" data-index="2" type="button">이미지 제거</button></fieldset>
</div></div>
<div class="panel"><h2>연락처 및 하단</h2><label>이메일 주소<input name="email" type="email"></label><label>하단 배경색<input class="color" name="contactBg" type="color"></label></div><button class="save">변경사항 저장하기 →</button><p id="notice" aria-live="polite"></p></form></section></main><script type="module" src="admin.js"></script></body></html>
